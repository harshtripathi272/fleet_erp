# Every push and pull request runs the same check the README asks of everyone before pushing:
# type-check, every API test (on an in-memory MongoDB), the API build and the web build.
# The run's summary shows the test counts and any failures; the full log is kept as a file.
name: check

on:
  push:
    branches: [main, "work/**"]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Cache the MongoDB binary used by the tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: API build
        run: npm run build
      - name: Web build
        run: npm run build:web
      - name: Summary
        if: always()
        run: |
          {
            echo "### Tests"
            if [ -f test.log ]; then
              echo '```'
              grep -E '^# (tests|pass|fail|cancelled|skipped|duration_ms)' test.log || echo "no totals (tests did not finish)"
              echo '```'
              if grep -q '^not ok' test.log; then
                echo "#### Failing"
                echo '```'
                grep -E '^\s*not ok' test.log | head -40
                echo '```'
              fi
            else
              echo "Tests did not run (an earlier step failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore
