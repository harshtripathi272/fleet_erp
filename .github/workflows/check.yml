# Runs the same check AGENTS.md asks of everyone before review:
# type-check, every API test (on an in-memory MongoDB), the API build and the web build.
# The run's summary shows the test counts and any failures; the full log is kept as a file.
name: check

# Every pull request (the gate before review), and every push to the shared branches (after a merge into
# develop, that run is the integration test of everything merged so far). Runs are never cancelled, so
# each push keeps its own log and a red result points at the push that caused it.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "work/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Cache the MongoDB binary used by the tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: UI check (no side stripes, decorative gradients, blur, pills or hover movement)
        run: npm run check:ui
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: API build
        run: npm run build
      - name: Web build
        run: npm run build:web
      - name: Summary
        if: always()
        run: |
          {
            echo "### Tests"
            if [ -f test.log ]; then
              echo '```'
              grep -E '^# (tests|pass|fail|cancelled|skipped|duration_ms)' test.log || echo "no totals (tests did not finish)"
              echo '```'
              if grep -q '^not ok' test.log; then
                echo "#### Failing"
                echo '```'
                grep -E '^\s*not ok' test.log | head -40
                echo '```'
              fi
            else
              echo "Tests did not run (an earlier step failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore

  # The production image, as Cloud Run runs it (docs/deploy-gcp.md): it builds, starts with production
  # settings against a real MongoDB, passes the health check Cloud Run uses, and refuses an unsafe setting.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        # The version the tests' in-memory MongoDB uses. MongoDB 8.0 refuses to start on the runners'
        # Linux kernel (6.19+, https://jira.mongodb.org/browse/SERVER-121912).
        image: mongo:8.2.6
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t fleet-erp:ci .
      - name: Production settings
        # SMTP points at nothing: the first Owner's e-mail fails, is logged, and start-up carries on.
        run: |
          {
            echo "MONGODB_URI=mongodb://127.0.0.1:27017/fleet_ci"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "APP_URL=https://fleet.ci.test"
            echo "OWNER_EMAIL=owner@ci.test"
            echo "TRUST_PROXY=1"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=2525"
            echo "SMTP_FROM=Fleet CI <no-reply@ci.test>"
            echo "CONSOLE_ENABLED=false"
            echo "FILE_STORAGE=local"
            echo "FILE_STORAGE_DIR=/tmp/files"
          } > prod.env
      - name: Start the container
        run: docker run -d --name app --network host --env-file prod.env fleet-erp:ci
      - name: Ready, as Cloud Run's startup check sees it
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/ready; then echo; break; fi
            [ "$i" = 60 ] && { echo "Not ready after 60 s"; exit 1; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/v1/health/ready | grep -q '"mongo":"connected"'
      - name: Healthy, by the image's own HEALTHCHECK
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app)"
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Production behaviour
        run: |
          headers="$(curl -fsSI http://127.0.0.1:3000/api/v1/health)"
          echo "$headers" | grep -qi '^strict-transport-security:' || { echo "No HSTS"; exit 1; }
          echo "$headers" | grep -qi '^cache-control: no-store' || { echo "API answers are cacheable"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200 ] || { echo "The web app is not served"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/console/)" = 404 ] || { echo "The console is on"; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/v1/auth/options | grep -q '"signUp":false' || { echo "Self sign-up is on"; exit 1; }
          docker logs app 2>&1 | grep -q 'First Owner account created' || { echo "No first Owner from OWNER_EMAIL"; exit 1; }
      - name: The hourly exchange-rate job runs in the image
        # The feed is off by default (manual rates), so the job finds nothing due and exits 0.
        run: |
          out="$(docker run --rm --network host --env-file prod.env -e LOG_LEVEL=info fleet-erp:ci node dist/jobs/fetchRates.js 2>&1)"
          echo "$out" | tail -5
          echo "$out" | grep -q 'nothing to do' || { echo "The rate job did not run as expected"; exit 1; }
      - name: An unsafe setting stops the container
        run: |
          set +e
          out="$(timeout 60 docker run --rm --network host --env-file prod.env -e PORT=3001 -e APP_URL=http://localhost fleet-erp:ci 2>&1)"
          code=$?
          set -e
          echo "$out" | tail -5
          [ "$code" != 0 ] && [ "$code" != 124 ] || { echo "Expected a refusal, got exit $code"; exit 1; }
          echo "$out" | grep -q 'APP_URL' || { echo "The refusal does not name APP_URL"; exit 1; }
      - name: Container log
        if: always()
        run: docker logs app 2>&1 | tail -60 || true

  # A company kit (#76) on Docker Compose, as a customer's server runs it: the example company's kit is
  # built, unzipped and started, and the company is there with its brand, areas and data. Started again,
  # nothing is applied twice. Caddy is left out: it needs a real domain for its certificate.
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: /tmp/acme-haulage-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Build and unzip the example company's kit
        # It carries the app's source, and Docker Compose builds the image from it (#103).
        working-directory: .
        run: |
          npm run kit -- tests/fixtures/kit/company.json --out /tmp
          unzip -q /tmp/acme-haulage-kit.zip -d /tmp
      - name: Fill in .env, as the kit's README says
        # SMTP points at nothing: the invitations fail, are logged, and the start carries on.
        run: |
          cp .env.example .env
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(openssl rand -hex 32)#" .env
          sed -i 's#^SMTP_HOST=.*#SMTP_HOST=127.0.0.1#; s#^SMTP_PORT=.*#SMTP_PORT=2525#; s#^SMTP_PASS=.*#SMTP_PASS=ci-only#' .env
          sed -i 's#^CONNECTION_AT_KEY=.*#CONNECTION_AT_KEY=ci-only#' .env
          if grep -nE '^[A-Z_]+=$' .env; then echo "A setting is still empty"; exit 1; fi
      - name: Start the app and its database
        run: docker compose up -d --build app mongo
      - name: Ready
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/ready; then echo; exit 0; fi
            sleep 1
          done
          echo "Not ready after 90 s"; exit 1
      - name: The company is there, with its brand, areas, data, roles, connection and people
        run: |
          q() { docker compose exec -T mongo mongosh fleet --quiet --eval "$1"; }
          check() { got="$(q "$2")"; echo "$1: $got"; [ "$got" = "$3" ] || { echo "expected $3"; exit 1; }; }
          check "product name" 'db.companies.findOne().brand.productName' 'Acme Fleet'
          check "logo stored" 'String(db.files.countDocuments({ _id: db.companies.findOne().brand.logoFileId }))' '1'
          check "areas" 'db.companies.findOne().modules.join(",")' 'masters,trips,finance,tracking'
          check "vehicles" 'String(db.vehicles.countDocuments())' '2'
          check "role" 'String(db.roles.countDocuments({ key: "dispatcher" }))' '1'
          check "connection" 'db.connections.findOne({ code: "SMS" }).provider' 'africastalking'
          check "people" 'db.users.find().toArray().map((u) => u.email).sort().join(",")' 'grace@acme-haulage.example,peter@acme-haulage.example'
          curl -fsS http://127.0.0.1:3000/api/v1/brand | grep -q '"productName":"Acme Fleet"' || { echo "The brand is not served"; exit 1; }
          docker compose logs app | grep -q 'Company file applied' || { echo "No 'Company file applied' in the log"; exit 1; }
      - name: Started again, nothing is applied twice
        run: |
          docker compose restart app
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/api/v1/health/ready >/dev/null 2>&1 && break; sleep 1; done
          q() { docker compose exec -T mongo mongosh fleet --quiet --eval "$1"; }
          [ "$(q 'String(db.vehicles.countDocuments())')" = 2 ] || { echo "Vehicles duplicated"; exit 1; }
          [ "$(q 'String(db.users.countDocuments())')" = 2 ] || { echo "People duplicated"; exit 1; }
          [ "$(docker compose logs app | grep -c 'Company file applied')" = 1 ] || { echo "Applied again with nothing changed"; exit 1; }
      - name: This computer (#103), started as someone would, with one command and no image built before
        working-directory: .
        run: |
          node -e "const f=require('./tests/fixtures/kit/company.json'); f.deploy={target:'local',port:8090}; delete f.deploy.smtp; f.company.key='acme-local'; require('fs').mkdirSync('/tmp/local/files',{recursive:true}); require('fs').mkdirSync('/tmp/local/data',{recursive:true}); require('fs').writeFileSync('/tmp/local/company.json', JSON.stringify(f))"
          cp tests/fixtures/kit/files/* /tmp/local/files/ && cp tests/fixtures/kit/data/* /tmp/local/data/
          npm run kit -- /tmp/local/company.json --out /tmp/local
          cd /tmp/local && unzip -q acme-local-kit.zip && cd acme-local-kit
          ./start.sh --no-open | tee start.log
          password="$(grep -E '^OWNER_PASSWORD=' .env | cut -d= -f2-)"
          [ -n "$password" ] || { echo "start.sh made no owner password"; exit 1; }
          curl -fsS http://localhost:8090/api/v1/brand | grep -q '"productName":"Acme Fleet"' || { echo "The brand is not served"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "{\"email\":\"grace@acme-haulage.example\",\"password\":\"$password\"}" http://localhost:8090/api/v1/auth/login)"
          [ "$code" = 200 ] || { echo "The owner can't sign in with OWNER_PASSWORD (HTTP $code)"; exit 1; }
          [ "$(docker compose --project-name fleet-acme-local-local exec -T mongo mongosh fleet --quiet --eval 'String(db.vehicles.countDocuments())')" = 2 ] || { echo "No data in this copy"; exit 1; }
      - name: Container log
        if: always()
        run: |
          docker compose logs app 2>&1 | tail -60 || true
          docker compose --project-name fleet-acme-local-local logs app 2>&1 | tail -40 || true
